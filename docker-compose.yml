services:
  postgres:
    image: postgres:16-alpine
    container_name: painter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-painter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-painter}
      POSTGRES_DB: painter
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the data volume is created for the first time.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-painter} -d painter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
